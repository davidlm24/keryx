<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KERYX · proposta de layout v2</title>
<!-- Mockup v2 for docs/presenter-layout-proposal-2026-10-09.md, part 2 (the UX addendum).
     Same layout as mockup.html, plus: an emphasis level for live information, visible names on
     the actions that change the screens, splitter grips, a Ver menu, density, long pt-BR names.
     ?s=<scenario>, ?d=compact, ?shot hides the mock toolbar. Song lines and verses are placeholders. -->
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<script src="../design-system/components/bundle.js"></script>
<style>
  /* ===== Proposed design-system additions (v2). Everything else is the current system. ===== */
  :root {
    --row-comfortable: 32px;   /* default list row; 28px (--row) stays as the compact density */
    --target: 24px;            /* minimum pointer target for any control, glyph stays 16px */
  }
  .kx-live-cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .kx-live-title { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--fg-1); }
  .kx-next-title { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--fg-1); }
  .kx-consequence { font-size: 12px; line-height: 16px; color: var(--fg-2); }
  /* Splitter: a grip appears on hover and keyboard focus (README: invisible until hover). */
  .kx-split { outline: none; }
  .kx-split::before { content: ""; position: absolute; left: 50%; top: 50%; width: 2px; height: 24px; margin: -12px 0 0 -1px; border-radius: 1px;
    background: radial-gradient(circle, var(--fg-3) 1px, transparent 1.5px) 0 0 / 2px 6px; opacity: 0; transition: opacity var(--duration-fast) var(--ease-out); }
  .kx-split:hover::before, .kx-split:focus-visible::before, .kx-split.show-grip::before { opacity: 1; }
  .kx-split:focus-visible::after, .kx-split.show-grip::after { background: var(--line-strong); }
  .kx-split.kx-split-h::before { width: 24px; height: 2px; margin: -1px 0 0 -12px; background-size: 6px 2px; }
  /* The actions that change the screens: one named group. */
  .kx-screens { display: inline-flex; align-items: center; height: var(--row); padding: 0 2px; gap: 2px; border-radius: var(--radius-control); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .kx-screens .kx-screens-k { padding: 0 6px 0 6px; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
  .kx-screens .kx-btn { height: 24px; padding: 0 6px; gap: 4px; }
  /* Sent receipt (120ms in, fades after 2s in the app). */
  .kx-receipt { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--air-fg); }

  /* ===== Layout (from v1) ===== */
  html, body { margin: 0; height: 100%; background: var(--bg-0); }
  .console { position: fixed; inset: 0; display: flex; flex-direction: column; gap: var(--gutter); padding: var(--gutter); }
  .topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-1) 0 var(--space-2);
    background: var(--bg-1); border-radius: var(--radius-panel); container: topbar / inline-size; }
  .topbar .kx-tabs { border-bottom: 0; height: var(--topbar); }
  .topbar .kx-tabs > button.is-on::after { background: var(--brand); }
  .topbar .search { flex: 1 1 260px; max-width: 320px; }
  .topbar .grow { flex: 1; }
  .topbar .kx-clock { font-size: 14px; }
  .topbar .menu { height: var(--row); padding: 0 8px; color: var(--fg-2); }
  @container topbar (max-width: 1280px) { .topbar .kx-clock { display: none; } }
  @container topbar (max-width: 1100px) { .topbar .search .lab, .topbar .search kbd { display: none; } .topbar .search { flex: 0 0 var(--row); padding: 0; justify-content: center; } .topbar .kx-screens .kx-screens-k { display: none; } }

  .main { flex: 1; min-height: 0; display: flex; }
  .col { display: flex; flex-direction: column; gap: var(--gutter); min-width: 0; min-height: 0; }
  .col > .kx-panel { flex: 1; }
  .kx-panel-h .kx-btn-icon { width: var(--target); height: var(--target); }
  [data-tier="wide"]   .c-lib { flex: 0 0 260px; }
  [data-tier="wide"]   .c-slides { flex: 0 0 300px; }
  [data-tier="wide"]   .c-setlist { flex: 0 0 320px; }
  [data-tier="medium"] .c-source { flex: 0 0 300px; }
  [data-tier="medium"] .c-slides { flex: 0 0 280px; }
  [data-tier="narrow"] .c-source { flex: 0 0 340px; }
  .c-live { flex: 1 1 auto; min-width: 520px; }
  [data-tier="narrow"] .c-source > .p-src { flex: 0 0 44%; }

  /* Density: comfortable (default) rows are 32px; compact keeps today's 28px. */
  [data-density="comfortable"] .kx-row { min-height: var(--row-comfortable); }
  [data-density="comfortable"] .kx-row .kx-row-title { font-size: 14px; line-height: 20px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  [data-density="comfortable"] .kx-row:not(.kx-row-1) .kx-row-main { padding: 6px 0; }
  @container (max-width: 640px) { .liveblock .kx-mon-cap .lab { display: none; } }
  [data-density="comfortable"] .kx-slide { font-size: 14px; line-height: 20px; padding-top: 8px; padding-bottom: 8px; }
  .kx-row .kx-btn { height: var(--target); min-width: var(--target); }

  /* Live column. K = captions 2×(28+4) + gaps 3×8 + player slot 36 + No ar/Próximo 40 = 164. */
  .live { background: var(--bg-1); border-radius: var(--radius-panel); flex: 1; min-height: 0; padding: var(--space-2); container-type: size; display: flex; justify-content: center; }
  .liveblock { --k: 164px; width: min(100cqw, calc((100cqh - var(--k)) / 0.82125)); display: flex; flex-direction: column; gap: var(--space-2); min-height: 0; }
  .liveblock .kx-mon-cap { height: 28px; gap: var(--space-2); }
  .liveblock .kx-mon-cap .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .liveblock .kx-mon-cap .kx-live-cap { flex: none; }
  .liveblock .kx-mon.is-air .kx-live-cap { color: var(--air-fg); } .liveblock .kx-mon.is-prev .kx-live-cap { color: var(--prev-fg); }
  .liveblock .kx-mon-cap .kx-meta { flex: none; white-space: nowrap; }
  .liveblock .kx-mon-cap .kx-btn { height: var(--target); padding: 0 6px; }
  .liverow { display: flex; gap: var(--space-3); flex: none; }
  .liverow .prev { width: 46%; flex: none; }
  .liverow .side { flex: 1; min-width: 0; padding-top: 32px; display: flex; flex-direction: column; gap: var(--space-2); }
  .send { height: 40px; width: 100%; font-size: 14px; }
  .send:disabled { background: var(--bg-3); color: var(--fg-2); }
  .notes { background: var(--bg-2); border-radius: var(--radius-control); padding: 6px var(--space-2); font-size: 13px; line-height: 18px; color: var(--fg-1); }
  .notes .kx-meta { display: block; margin-bottom: 2px; }
  .slot { height: 36px; flex: none; }
  .slot .kx-transport { height: 36px; background: var(--bg-2); border-radius: var(--radius-control); padding: 0 var(--space-2); }
  .slot .kx-transport .kx-btn { height: 28px; }
  .slot .kx-transport .kx-seek > i { background: var(--air); }
  .nn { flex: 1; min-height: 40px; display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid var(--line); }
  .nn > * { flex: none; }
  .nn-line { display: flex; align-items: center; gap: var(--space-3); height: 40px; white-space: nowrap; overflow: hidden; }
  .nn-line > span { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .nn-line .half { flex: 1 1 0; min-width: 0; }
  .nn-line .k { flex: none; color: var(--fg-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
  .nn-line .kx-next-title { overflow: hidden; text-overflow: ellipsis; }
  .nn-line .air .kx-dot { color: var(--air); }
  .nn-line .kx-btn { flex: none; }
  .nn .kx-row { min-height: 28px; }

  .scr-video { position: absolute; inset: 0; background: linear-gradient(135deg, #1b2a3a, #3a2a1b); }
  .scr-video .lab { position: absolute; left: 4cqw; bottom: 4cqw; font-family: var(--font-sans); font-size: 3cqw; color: #ffffffcc; }
  .ph { color: var(--fg-3); font-style: italic; }
  .kx-screen-txt .ph { color: #ffffffb3; }
  .warnmeta { color: var(--warn-fg) !important; }

  .pop-out { position: absolute; z-index: 30; top: calc(var(--gutter) + var(--topbar) + 4px); right: var(--gutter); width: 400px; }
  .pop-out .kx-out .acts { grid-column: 2 / 4; display: flex; gap: 4px; margin: 2px 0 6px -8px; }
  .pop-out .kx-out .acts .kx-btn { height: var(--target); }
  .pop-out .hd { display: flex; align-items: center; height: 28px; padding: 0 var(--space-2); }
  .pop-out .hd .kx-section { flex: 1; }
  .pop-ver { position: absolute; z-index: 30; top: calc(var(--gutter) + var(--topbar) + 4px); width: 260px; }
  .palette { position: absolute; z-index: 30; top: calc(var(--gutter) + var(--topbar) + 4px); background: var(--bg-2); border-radius: var(--radius-panel); box-shadow: var(--popover); padding: var(--space-1); }
  .palette .kx-field { height: 36px; background: var(--bg-3); margin-bottom: var(--space-1); }
  .palette .kx-row { border-radius: var(--radius-control); }
  .palette .kx-row .kx-row-acts { display: inline-flex; }
  .banner-t { font-size: 13px; font-weight: 600; }

  .mock { position: fixed; z-index: 100; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 2px; max-width: 560px; padding: 4px; background: var(--bg-2); border-radius: var(--radius-panel); box-shadow: var(--popover); }
  .mock .kx-btn { height: 24px; font-size: 11px; }
  .mock .tier { padding: 0 8px; font-size: 11px; color: var(--fg-3); align-self: center; }
</style>
</head>
<body>
<div id="app" class="kx"></div>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const SHOT = Q.has("shot");
  let scen = Q.get("s") || "song";
  let density = Q.get("d") === "compact" ? "compact" : "comfortable";
  const ic = (n) => `<i data-icon="${n}"></i>`;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  // Long, realistic pt-BR names (invented). Song lines and verses stay placeholders.
  const lyr = (a, b) => `<div class="kx-screen-txt"><div class="kx-screen-lyrics">${a}\n${b}</div></div>`;
  const verse = (ref, n) => `<div class="kx-screen-txt"><div class="kx-screen-verse"><sup>${n}</sup><span class="ph">texto do versículo ${n} — da edição instalada</span></div><div class="kx-screen-ref">${ref}</div></div>`;
  const video = (t, time) => `<div class="scr-video"><span class="lab">${t} · ${time}</span></div>`;
  const quiz = (lab, t) => `<div class="kx-screen-txt"><div class="kx-screen-ref">${lab}</div><div class="kx-screen-verse">${t}</div></div>`;
  const blank = (t) => `<div class="kx-screen-empty">${t}</div>`;
  const S2 = "Tu és fiel, Senhor, em cada amanhecer da minha vida";
  const SONG = [
    ["Estrofe 1", "Primeira linha da estrofe, um pouco mais longa\nsegunda linha da estrofe"],
    ["Refrão", "Primeira linha do refrão com palavras compridas\nsegunda linha do refrão"],
    ["Estrofe 2", "Terceira linha da estrofe, que também é longa\nquarta linha da estrofe"],
    ["Refrão", "Primeira linha do refrão com palavras compridas\nsegunda linha do refrão"],
    ["Ponte", "Linha da ponte\nsegunda linha da ponte"],
    ["Final", "Última linha\nda canção"],
  ];
  const QUIZ = [
    ["Pergunta 1", "Quem visitou Jesus à noite para conversar sobre o novo nascimento?"],
    ["Resposta", "✓ B) Nicodemos, um dos principais dos judeus"],
    ["Pergunta 2", "O que Jesus quis dizer com nascer da água e do Espírito?"],
    ["Resposta", "✓ C) Resposta de exemplo da lição"],
  ];
  const base = [
    { sec: "Pré-culto" },
    { id: "cd", icon: "clock", t: "Contagem regressiva para o início do culto", m: "5 min", time: "19:25" },
    { id: "av", icon: "megaphone", t: "Avisos da semana: retiro de jovens e ceia", m: "3 avisos", time: "19:30" },
    { sec: "Louvor" },
    { id: "s1", icon: "music", t: "Canção de abertura com título longo (exemplo)", m: "Ministério de exemplo · Sol", time: "19:35" },
    { id: "s2", icon: "music", t: S2, m: "Ministério de exemplo · Ré", time: "19:40" },
    { id: "vd", icon: "film", t: "Vídeo · Missões no sertão nordestino", m: "2:30", time: "19:45" },
    { sec: "Palavra" },
    { id: "jo", icon: "book", t: "João 3:16-21", m: "Nova Versão Internacional (NVI)", time: "19:48" },
    { id: "eb", icon: "text", t: "Escola bíblica · Lição 3 — O novo nascimento", m: "4 perguntas", time: "20:10" },
    { id: "s3", icon: "music", t: "Canção final de envio e bênção (exemplo)", m: "Ministério de exemplo · Lá", time: "20:30" },
  ];
  const order = base.filter((x) => x.id).map((x) => x.id);
  const OUTS = [
    { icon: "projector", n: "Projetor", m: "Monitor 2 · 1920×1080", st: "Conectada" },
    { icon: "monitor", n: "Retorno do palco", m: "Monitor 3 · atual, próximo e relógio", st: "Conectada" },
    { icon: "tv", n: "Telão lateral", m: "Rede · 192.168.0.24", st: "Conectada" },
  ];
  const song = (a, p) => ({ prog: { t: S2, pos: `${a + 1}/6`, scr: lyr(...SONG[a][1].split("\n")) }, pv: { t: S2, pos: `${p + 1}/6`, scr: lyr(...SONG[p][1].split("\n")) }, slides: { title: S2, list: SONG, air: a, prev: p } });
  const SC = {
    song: { label: "Música", env: "culto", air: "s2", ...song(1, 2) },
    sent: { label: "Acabou de enviar", env: "culto", air: "s2", sent: true, ...song(2, 2) },
    scripture: { label: "Escritura", env: "culto", air: "s2", palette: true, ...song(5, 5), pv: { t: "Nada na prévia", pos: "", scr: blank("Nada na prévia") }, empty: true },
    video: { label: "Vídeo", env: "culto", air: "vd", player: true,
      prog: { t: "Vídeo · Missões no sertão nordestino", pos: "tocando", scr: video("Vídeo · Missões", "0:42 / 2:30") },
      pv: { t: "João 3:16-21", pos: "1/6", scr: verse("João 3:16 · NVI", 16) },
      note: "Ao enviar: toca nas telas de vídeo; o projetor continua como está.",
      slides: { title: "Vídeo · Missões no sertão nordestino", list: [["Vídeo", "2:30 · toca em Projetor e Telão lateral"]], air: 0, prev: -1 } },
    school: { label: "Escola bíblica", env: "culto", air: "eb",
      prog: { t: "Lição 3 — O novo nascimento", pos: "Pergunta 2", scr: quiz("Pergunta 2", QUIZ[2][1]) },
      pv: { t: "Resposta da pergunta 2", pos: "→ revela", scr: quiz("Resposta", QUIZ[3][1]) },
      teacher: "Deixe a turma responder antes de revelar. Ligar com João 3:2 e com a conversa da semana passada sobre arrependimento.",
      slides: { title: "Escola bíblica · Lição 3", list: QUIZ, air: 2, prev: 3 } },
    nooutput: { label: "Sem saída", env: "culto", air: "s2", outs: [], popout: true, ...song(1, 2) },
    disconnect: { label: "Tela caiu", env: "culto", air: "s2", ...song(1, 2),
      outs: OUTS.map((o, i) => (i === 2 ? { ...o, st: "Desconectada", warn: true, m: "Rede · 192.168.0.24 · caiu às 19:42" } : o)),
      banner: { t: "Telão lateral desconectado às 19:42", sub: "o projetor e o retorno continuam no ar" } },
    ver: { label: "Menu Ver", env: "culto", air: "s2", ver: true, grip: true, ...song(1, 2) },
  };

  const outputsOf = (s) => s.outs || OUTS;
  const liveContent = (s, o) => (o.warn ? `Última imagem: ${s.prog.pos}` : o.n === "Retorno do palco" ? "Atual e próximo · 19:42" : `${s.prog.t} · ${s.prog.pos}`);
  function chip(s) {
    const outs = outputsOf(s);
    if (!outs.length) return `<button class="kx-status is-warn kx-t" title="Saídas: abrir, conferir e recuperar telas"><span class="kx-dot"></span>Nenhuma saída aberta</button>`;
    const bad = outs.filter((o) => o.warn).length;
    if (bad) return `<button class="kx-status is-warn kx-t"><span class="kx-dot"></span>Saídas · ${bad} com problema</button>`;
    return `<button class="kx-status kx-t"><span class="kx-dot"></span>Saídas · ${outs.length} de ${outs.length}</button>`;
  }
  function onScreens(s) {
    const outs = outputsOf(s), ok = outs.filter((o) => !o.warn).length;
    if (!outs.length) return `<span class="kx-meta warnmeta">em nenhuma tela</span>`;
    if (ok < outs.length) return `<span class="kx-meta warnmeta">em ${ok} de ${outs.length} telas</span>`;
    return `<span class="kx-meta">em ${ok} telas</span>`;
  }
  function topbar(s) {
    return `<header class="topbar">
      <span class="kx-mark"></span>
      <nav class="kx-tabs"><button class="is-on">KERYX</button><button>Bíblia</button></nav>
      <button class="kx-btn menu ${s.ver ? "is-on" : ""}" aria-expanded="${!!s.ver}">Ver</button>
      <div class="kx-field search" title="Buscar ou comandar · /">${ic("search")}<span class="lab">Buscar ou comandar</span><span class="grow"></span><kbd>/</kbd></div>
      <span class="grow"></span>
      <div class="kx-seg kx-seg-mode"><button data-mode="ensaio">Ensaio</button><button class="is-on" data-mode="live">Ao vivo · 32:10</button></div>
      <span class="kx-clock">19:42</span>
      ${chip(s)}
      <span class="kx-screens" role="group" aria-label="Telas: ações que mudam o que o público vê">
        <span class="kx-screens-k">Telas</span>
        <button class="kx-btn" title="Tela preta · B">${ic("black")}Tela preta</button>
        <button class="kx-btn" title="Mostrar logo · L">${ic("logo")}Logo</button>
        <button class="kx-btn" title="Limpar texto · C">${ic("eraser")}Limpar</button>
        <button class="kx-btn" title="Encerrar a projeção · Esc">${ic("stop")}Encerrar</button>
      </span>
    </header>`;
  }
  function row(x, st = "", one = false) {
    return `<div class="kx-row ${one ? "kx-row-1" : ""} ${st}"><span class="kx-glyph">${ic(x.icon)}</span><span class="kx-row-main"><span class="kx-row-title">${x.t}</span>${one ? "" : `<span class="kx-row-meta">${x.m}</span>`}</span><span class="kx-row-time">${x.time}</span></div>`;
  }
  function setlistRows(s) {
    const ai = order.indexOf(s.air);
    return base.map((x) => (x.sec ? `<div class="kx-menu-h"><span class="kx-section">${x.sec}</span></div>` : row(x, x.id === s.air ? "is-air" : order.indexOf(x.id) < ai ? "is-done" : ""))).join("");
  }
  const nextOf = (s) => base.find((x) => x.id === order[order.indexOf(s.air) + 1]);
  function upcoming(s) {
    const rest = order.slice(order.indexOf(s.air) + 2);
    return rest.length ? `<div class="kx-menu-h"><span class="kx-section">Depois</span></div>` + rest.map((id) => row(base.find((b) => b.id === id), "", true)).join("") : "";
  }
  const split = (grip, h) => `<div class="kx-split ${h ? "kx-split-h" : ""} ${grip ? "show-grip" : ""}" tabindex="0" role="separator" aria-label="Redimensionar · clique duplo restaura"></div>`;
  function panel(title, body, extra = "", cls = "") {
    return `<section class="kx-panel ${cls}"><div class="kx-panel-h"><span class="kx-section">${title}</span>${extra}<button class="kx-btn kx-btn-icon" title="Recolher">${ic("collapse")}</button></div><div class="kx-panel-b">${body}</div></section>`;
  }
  function library() {
    const rows = [["Canção de abertura com título longo (exemplo)", "Ministério de exemplo · Sol"], [S2, "Ministério de exemplo · Ré"], ["Canção final de envio e bênção (exemplo)", "Ministério de exemplo · Lá"], ["Hino 40 do hinário de exemplo", "Hinário"]]
      .map(([t, m]) => row({ icon: "music", t, m, time: "" })).join("");
    return `<nav class="kx-tabs"><button class="is-on">Letras</button><button>Mídia</button><button>Avisos</button><button>Escola</button></nav>
      <div style="padding:var(--space-2)"><div class="kx-field">${ic("search")}<input placeholder="Buscar letras"></div></div>${rows}`;
  }
  function slides(s) {
    const sl = s.slides;
    return sl.list.map(([lab, t], i) => {
      const st = i === sl.air ? "is-air" : i === sl.prev ? "is-prev" : i === sl.air + 1 ? "is-next" : "";
      return `<div class="kx-slide ${st}"><span class="kx-slide-n">${i + 1}</span><span><div class="kx-slide-lab">${lab}</div>${esc(t)}</span></div>`;
    }).join("");
  }
  function liveColumn(s, tier) {
    const next = nextOf(s), n = outputsOf(s).filter((o) => !o.warn).length;
    const consequence = !outputsOf(s).length ? "Nenhuma tela aberta: o envio só muda o Programa." : `Leva a Prévia para ${n === 1 ? "a tela" : `as ${n} telas`}.`;
    // What is on air is already the Programa caption; this line gives the next item the full width.
    const nn = `<div class="nn"><div class="nn-line">
        <span class="half"><span class="k">Próximo</span><span class="kx-next-title">${next ? next.t : "fim da setlist"}</span>${next ? `<span class="kx-meta">${next.time}</span>` : ""}</span>
        ${next ? `<button class="kx-btn kx-btn-outline" title="Pôr o próximo item na Prévia">Pôr na prévia</button>` : ""}
      </div>${tier === "wide" ? "" : upcoming(s)}</div>`;
    const player = s.player ? `<div class="kx-transport"><button class="kx-btn kx-btn-icon" title="Pausar · Espaço">${ic("pause")}</button><button class="kx-btn" title="Parar e tirar do ar">${ic("stop")}Parar</button><span class="kx-time">0:42 / 2:30</span><span class="kx-seek"><i style="width:28%"></i><b style="left:28%"></b></span><span class="kx-meter"><i><b style="height:62%"></b></i><i><b style="height:58%"></b></i></span><span class="kx-meta">Toca em Projetor · Telão</span></div>` : "";
    return `<div class="col c-live"><div class="live"><div class="liveblock">
      <div class="kx-mon is-air"><div class="kx-mon-cap"><span class="kx-live-cap">Programa</span><span class="t kx-live-title">${s.prog.t}</span><span class="kx-meta">${s.prog.pos}</span>${s.sent ? `<span class="kx-receipt">${ic("check")}Enviado 19:42:05</span>` : onScreens(s)}<button class="kx-btn" title="Camadas e tema do que está no ar">${ic("layers")}<span class="lab">Camadas</span></button></div><div class="kx-mon-screen">${s.prog.scr}</div></div>
      <div class="liverow">
        <div class="kx-mon is-prev prev"><div class="kx-mon-cap"><span class="kx-live-cap">Prévia</span><span class="t kx-next-title">${s.pv.t}</span><span class="kx-meta">${s.pv.pos}</span></div><div class="kx-mon-screen">${s.pv.scr}</div></div>
        <div class="side">
          <button class="kx-btn kx-btn-air send" title="Enviar ao ar · Enter (Ctrl+Enter de qualquer lugar)" ${s.empty ? "disabled" : ""}>Enviar ao ar</button>
          <div class="kx-consequence">${s.empty ? "Escolha um item da Setlist, um slide ou busque com /." : consequence}</div>
          ${s.note ? `<div class="kx-meta">${s.note}</div>` : ""}
          ${s.teacher ? `<div class="notes"><span class="kx-meta">Notas do professor · só no console e no palco</span>${s.teacher}</div>` : ""}
        </div>
      </div>
      <div class="slot">${player}</div>
      ${nn}
    </div></div></div>`;
  }
  function culto(s, tier) {
    const n = s.slides.list.length;
    const cnt = `<span class="kx-count kx-meta">${n} ${n === 1 ? "slide" : "slides"}</span>`;
    const slidesP = panel(s.slides.title, slides(s), cnt);
    const src = `<section class="kx-panel p-src"><nav class="kx-tabs"><button class="is-on">Setlist</button><button>Biblioteca</button></nav><div class="kx-panel-b">${setlistRows(s)}</div></section>`;
    if (tier === "wide") return `<div class="col c-lib">${panel("Biblioteca", library())}</div>${split()}<div class="col c-slides">${slidesP}</div>${split(s.grip)}${liveColumn(s, tier)}${split()}<div class="col c-setlist">${panel("Setlist · Culto de domingo", setlistRows(s), `<span class="kx-count kx-meta">1h05</span>`)}</div>`;
    if (tier === "medium") return `<div class="col c-source">${src}</div>${split()}<div class="col c-slides">${slidesP}</div>${split(s.grip)}${liveColumn(s, tier)}`;
    return `<div class="col c-source">${src}${slidesP}</div>${split(s.grip)}${liveColumn(s, tier)}`;
  }
  function popOut(s) {
    const outs = outputsOf(s), ok = outs.filter((o) => !o.warn).length;
    const rows = outs.length ? outs.map((o) => `<div class="kx-out is-tall ${o.warn ? "is-warn" : ""}"><span class="kx-glyph">${ic(o.icon)}</span>
        <span><div class="kx-out-name">${o.n}</div><div class="kx-out-meta">${o.m}</div><div class="kx-out-meta" style="color:var(--fg-2)">Mostra: ${liveContent(s, o)}</div></span>
        <span class="kx-out-st"><span class="kx-dot"></span>${o.st}</span>
        <span class="acts">${o.warn ? `<button class="kx-btn kx-btn-outline">Copiar link da tela</button><button class="kx-btn">Remover da lista</button>` : `<button class="kx-btn">Identificar</button>`}</span></div>`).join("")
      : `<div class="kx-empty"><span class="kx-glyph">${ic("projector")}</span><div class="kx-empty-t">Nenhuma saída aberta</div><div>O Programa não está em nenhuma tela.</div><div style="display:flex;gap:6px;margin-top:8px"><button class="kx-btn kx-btn-outline">Abrir projetor</button><button class="kx-btn">Telas na rede…</button></div></div>`;
    return `<div class="kx-pop pop-out"><div class="hd"><span class="kx-section">Saídas${outs.length ? ` · ${ok} de ${outs.length} conectadas` : ""}</span></div>${rows}<div class="kx-menu-sep"></div><button class="kx-menu-item"><span class="kx-glyph">${ic("check")}</span>Verificar tudo…</button></div>`;
  }
  function verMenu() {
    const it = (t, on, k = "") => `<button class="kx-menu-item ${on ? "is-checked" : ""}"><span class="kx-glyph">${on ? ic("check") : ""}</span>${t}${k ? `<span class="kx-kbd">${k}</span>` : ""}</button>`;
    return `<div class="kx-pop pop-ver"><div class="kx-menu-h"><span class="kx-section">Módulos</span></div>${it("Biblioteca", 1)}${it("Slides", 1)}${it("Setlist", 1)}${it("Camadas", 0)}${it("Linha do tempo", 0)}
      <div class="kx-menu-sep"></div><div class="kx-menu-h"><span class="kx-section">Densidade</span></div>${it("Confortável", density === "comfortable")}${it("Compacta", density === "compact")}
      <div class="kx-menu-sep"></div>${it("Restaurar layout", 0)}${it("Atalhos do teclado", 0, "?")}</div>`;
  }
  function palette() {
    const r = (icon, t, m, acts, sel) => `<div class="kx-row ${sel ? "is-selected" : ""}"><span class="kx-glyph">${ic(icon)}</span><span class="kx-row-main"><span class="kx-row-title">${t}</span><span class="kx-row-meta">${m}</span></span><span class="kx-row-acts">${acts}</span></div>`;
    return `<div class="palette"><div class="kx-field">${ic("search")}<input value="jo 3 16"><kbd>Esc</kbd></div>
      <div class="kx-menu-h"><span class="kx-section">Bíblia · NVI instalada</span></div>
      ${r("book", "João 3:16", "Enter põe na prévia aqui · Shift+Enter adiciona à setlist", `<button class="kx-btn">Abrir na Bíblia</button>`, true)}
      ${r("book", "João 3:16-21", "Passagem da setlist · 19:48", "", false)}</div>`;
  }

  const app = document.getElementById("app");
  let tier = "wide";
  function render() {
    const s = SC[scen];
    app.innerHTML = `<div class="console" data-tier="${tier}" data-density="${density}">${topbar(s)}${s.banner ? `<div class="kx-banner is-warn">${ic("wifi-off")}<span class="banner-t">${s.banner.t}</span><span class="kx-sub">${s.banner.sub}</span><span class="kx-spacer"></span><button class="kx-btn">Ver saídas</button></div>` : ""}<div class="main">${culto(s, tier)}</div>${s.popout ? popOut(s) : ""}${s.palette ? palette() : ""}${s.ver ? verMenu() : ""}</div>
      ${SHOT ? "" : `<div class="mock"><span class="tier">${tier} · ${innerWidth}×${innerHeight}</span>${Object.entries(SC).map(([k, v]) => `<button class="kx-btn ${k === scen ? "is-on" : ""}" data-s="${k}">${v.label}</button>`).join("")}<button class="kx-btn" data-d="1">${density === "compact" ? "Compacta" : "Confortável"}</button></div>`}`;
    KERYX.mount(app);
    const pal = app.querySelector(".palette");
    if (pal) {
      const search = app.querySelector(".topbar .search").getBoundingClientRect();
      const live = app.querySelector(".c-live").getBoundingClientRect();
      const left = Math.max(6, Math.min(search.left, live.left - 346));
      pal.style.left = left + "px";
      pal.style.width = Math.max(340, Math.min(560, live.left - 6 - left)) + "px";
    }
    // The Setlist keeps the item on air in view (one row of context above it).
    app.querySelectorAll(".kx-panel-b").forEach((b) => { const a = b.querySelector(".kx-row.is-air"); if (a) b.scrollTop = Math.max(0, a.offsetTop - b.offsetTop - 40); });
    const ver = app.querySelector(".pop-ver");
    if (ver) ver.style.left = app.querySelector(".topbar .menu").getBoundingClientRect().left + "px";
    observe();
  }
  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-s]"); if (b) { scen = b.dataset.s; render(); }
    if (e.target.closest("[data-d]")) { density = density === "compact" ? "comfortable" : "compact"; render(); }
  });
  let ro;
  function observe() {
    const main = app.querySelector(".main");
    if (ro) ro.disconnect();
    ro = new ResizeObserver(() => {
      const w = main.clientWidth, t = w >= 1400 ? "wide" : w >= 1100 ? "medium" : "narrow";
      if (t !== tier) { tier = t; render(); }
    });
    ro.observe(main);
  }
  render();
})();
</script>
</body>
</html>
