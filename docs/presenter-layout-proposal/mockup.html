<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KERYX · proposta de layout</title>
<!-- Static mockup for docs/presenter-layout-proposal-2026-10-09.md. Built only from the
     design system (tokens.css + kx- classes + icon set); the few layout rules below are
     the proposal itself. Song lines and verses are placeholders, never real text.
     ?s=<scenario> picks a state; ?shot hides the mock toolbar for screenshots. -->
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<script src="../design-system/components/bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-0); }
  .console { position: fixed; inset: 0; display: flex; flex-direction: column; gap: var(--gutter); padding: var(--gutter); }

  /* Top bar: one line at every width (container queries drop the clock, then shorten the search). */
  .topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-1) 0 var(--space-2);
    background: var(--bg-1); border-radius: var(--radius-panel); container: topbar / inline-size; }
  .topbar .kx-tabs { border-bottom: 0; height: var(--topbar); }
  .topbar .kx-tabs > button.is-on::after { background: var(--brand); }
  .topbar .search { flex: 1 1 320px; max-width: 360px; }
  .topbar .grow { flex: 1; }
  .topbar .kx-clock { font-size: 14px; }
  .topbar .emerg { display: inline-flex; gap: 2px; }
  @container topbar (max-width: 1100px) { .topbar .kx-clock { display: none; } }
  @container topbar (max-width: 900px) { .topbar .search kbd, .topbar .search .lab { display: none; } .topbar .search { flex: 0 0 120px; } }

  .main { flex: 1; min-height: 0; display: flex; gap: var(--gutter); }
  .col { display: flex; flex-direction: column; gap: var(--gutter); min-width: 0; min-height: 0; }
  .col > .kx-panel { flex: 1; }

  /* ---- The proposal: three width tiers measured on .main (wide ≥ 1400, medium ≥ 1100, narrow below). ---- */
  [data-tier="wide"]   .c-lib { flex: 0 0 260px; }
  [data-tier="wide"]   .c-slides { flex: 0 0 300px; }
  [data-tier="wide"]   .c-setlist { flex: 0 0 320px; }
  [data-tier="medium"] .c-source { flex: 0 0 300px; }
  [data-tier="medium"] .c-slides { flex: 0 0 280px; }
  [data-tier="narrow"] .c-source { flex: 0 0 340px; }
  .c-live { flex: 1 1 auto; min-width: 520px; }
  [data-tier="narrow"] .c-source > .p-src { flex: 0 0 44%; }

  /* ---- Live column: Programa → Prévia + Enviar → player slot → No ar / Próximo. One block, no gap. ----
     progW = min(column width, (column height − K) / 0.82125), where 0.82125 = 9/16 (Programa)
     + 0.46 × 9/16 (Prévia at 46 % of the block) and K = the fixed rows: captions 2×24, gaps 3×8,
     player slot 36, Próximo row 28. The player slot is reserved, so the monitors never move. */
  .live { background: var(--bg-1); border-radius: var(--radius-panel); flex: 1; min-height: 0; padding: var(--space-2); container-type: size; display: flex; justify-content: center; }
  .liveblock { --k: 136px; width: min(100cqw, calc((100cqh - var(--k)) / 0.82125)); display: flex; flex-direction: column; gap: var(--space-2); min-height: 0; }
  .liveblock .kx-mon-cap .kx-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .liveblock .kx-mon-cap .kx-btn { height: 20px; padding: 0 4px; }
  .liverow { display: flex; gap: var(--space-3); flex: none; }
  .liverow .prev { width: 46%; flex: none; }
  .liverow .side { flex: 1; min-width: 0; padding-top: 24px; display: flex; flex-direction: column; gap: var(--space-2); }
  .send { height: 40px; width: 100%; font-size: 13px; }
  .send:disabled { background: var(--bg-3); color: var(--fg-2); }
  .notes { background: var(--bg-2); border-radius: var(--radius-control); padding: 6px var(--space-2); font-size: 12px; line-height: 16px; color: var(--fg-1); }
  .notes .kx-meta { display: block; margin-bottom: 2px; }
  .slot { height: 36px; flex: none; }
  .slot .kx-transport { height: 36px; background: var(--bg-2); border-radius: var(--radius-control); padding: 0 var(--space-2); }
  .slot .kx-transport .kx-btn { height: 28px; }
  .slot .kx-transport .kx-seek > i { background: var(--air); }
  .nn { flex: 1; min-height: 28px; display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid var(--line); }
  .nn > * { flex: none; }
  .nn .kx-row { min-height: 26px; }
  .nn-strip { display: flex; align-items: center; gap: var(--space-3); height: 28px; white-space: nowrap; overflow: hidden; }
  .nn-strip .k { color: var(--fg-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
  .nn-strip .v { color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; }
  .nn-strip .air .kx-dot { color: var(--air); } .nn-strip .nx .kx-dot { color: var(--fg-3); }
  .nn-strip .kx-btn { margin-left: auto; height: 22px; }

  /* Screens (monitor content) */
  .scr-video { position: absolute; inset: 0; background: linear-gradient(135deg, #1b2a3a, #3a2a1b); }
  .scr-video .lab { position: absolute; left: 4cqw; bottom: 4cqw; font-family: var(--font-sans); font-size: 3cqw; color: #ffffffcc; }
  .ph { color: var(--fg-3); font-style: italic; }
  .kx-screen-txt .ph { color: #ffffffb3; }
  .warnmeta { color: var(--warn-fg) !important; }

  /* Popovers anchored to the top bar */
  .pop-out { position: absolute; z-index: 30; top: calc(var(--gutter) + var(--topbar) + 4px); right: var(--gutter); width: 380px; }
  .pop-out .kx-out { grid-template-columns: 16px 1fr auto; }
  .pop-out .kx-out .acts { grid-column: 2 / 4; display: flex; gap: 4px; margin: 2px 0 6px -8px; }
  .pop-out .kx-out .acts .kx-btn { height: 22px; }
  .pop-out .hd { display: flex; align-items: center; height: 28px; padding: 0 var(--space-2); }
  .pop-out .hd .kx-section { flex: 1; }
  /* The palette never covers the Programa: it opens left-anchored over the source side. */
  .palette { position: absolute; z-index: 30; top: calc(var(--gutter) + var(--topbar) + 4px); background: var(--bg-2); border-radius: var(--radius-panel); box-shadow: var(--popover); padding: var(--space-1); }
  .palette .kx-field { height: 36px; background: var(--bg-3); margin-bottom: var(--space-1); }
  .palette .kx-row { border-radius: var(--radius-control); }
  .palette .kx-row .kx-row-acts { display: inline-flex; }

  /* Bíblia environment */
  .c-bpick { flex: 0 0 280px; } .c-bair { flex: 0 0 360px; }
  [data-tier="narrow"] .c-bair { flex: 0 0 330px; }
  .bair-b { flex: 1; min-height: 0; display: flex; flex-direction: column; container-type: size; }
  .bair-b .airmon { padding: 0 var(--space-2); flex: none; display: flex; justify-content: center; }
  .bair-b .airmon .kx-mon { width: min(100%, calc(35cqh * 16 / 9)); }
  .bair-b .sel { flex: 1; min-height: 0; overflow: auto; }
  .bair-b .acts { flex: none; display: flex; gap: var(--space-1); padding: var(--space-2); border-top: 1px solid var(--line); }
  .bair-b .acts .kx-btn-air { flex: 1; height: 36px; }
  .acts .kx-btn-air:disabled { background: var(--bg-3); color: var(--fg-2); }
  .edition { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); }
  .edition.is-warn { color: var(--warn-fg); }
  .bhead { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); height: 36px; flex: none; }
  .bhead .t { color: var(--fg-1); font-size: 14px; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: var(--space-2); }
  .chips .kx-btn { height: 26px; min-width: 32px; background: var(--bg-2); }
  .chips .kx-btn.is-on { background: var(--bg-3); color: var(--fg-1); box-shadow: inset 0 0 0 1px var(--line-strong); }

  /* Mock-only toolbar (not part of the proposal) */
  .mock { position: fixed; z-index: 100; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 2px; max-width: 520px; padding: 4px; background: var(--bg-2); border-radius: var(--radius-panel); box-shadow: var(--popover); }
  .mock .kx-btn { height: 24px; font-size: 11px; }
  .mock .tier { padding: 0 8px; font-size: 11px; color: var(--fg-3); align-self: center; }
</style>
</head>
<body>
<div id="app" class="kx"></div>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const SHOT = Q.has("shot");
  let scen = Q.get("s") || "song";
  const ic = (n) => `<i data-icon="${n}"></i>`;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  // ---------- content (placeholders only) ----------
  const lyr = (a, b) => `<div class="kx-screen-txt"><div class="kx-screen-lyrics">${a}\n${b}</div></div>`;
  const verse = (ref, n) => `<div class="kx-screen-txt"><div class="kx-screen-verse"><sup>${n}</sup><span class="ph">texto do versículo ${n} — da edição instalada</span></div><div class="kx-screen-ref">${ref}</div></div>`;
  const video = (t, time) => `<div class="scr-video"></div><div class="scr-video"><span class="lab">${t} · ${time}</span></div>`;
  const quiz = (lab, t) => `<div class="kx-screen-txt"><div class="kx-screen-ref">${lab}</div><div class="kx-screen-verse">${t}</div></div>`;
  const blank = (t) => `<div class="kx-screen-empty">${t}</div>`;

  const SONG_SLIDES = [
    ["Estrofe 1", "Primeira linha da estrofe\nsegunda linha da estrofe"],
    ["Refrão", "Primeira linha do refrão\nsegunda linha do refrão"],
    ["Estrofe 2", "Terceira linha da estrofe\nquarta linha da estrofe"],
    ["Refrão", "Primeira linha do refrão\nsegunda linha do refrão"],
    ["Ponte", "Linha da ponte\nsegunda linha da ponte"],
    ["Final", "Última linha\nda canção"],
  ];
  const QUIZ_SLIDES = [
    ["Pergunta 1", "Quem visitou Jesus à noite?"],
    ["Resposta", "✓ B) Nicodemos"],
    ["Pergunta 2", "Qual a pergunta de exemplo número dois?"],
    ["Resposta", "✓ C) Resposta de exemplo"],
  ];

  const base = [
    { sec: "Pré-culto" },
    { id: "cd", icon: "clock", t: "Contagem regressiva", m: "5 min", time: "19:25" },
    { id: "av", icon: "megaphone", t: "Avisos da semana", m: "3 avisos", time: "19:30" },
    { sec: "Louvor" },
    { id: "s1", icon: "music", t: "Canção de abertura", m: "Exemplo · Sol", time: "19:35" },
    { id: "s2", icon: "music", t: "Canção de exemplo 2", m: "Exemplo · Ré", time: "19:40" },
    { id: "vd", icon: "film", t: "Vídeo · Missões", m: "2:30", time: "19:45" },
    { sec: "Palavra" },
    { id: "jo", icon: "book", t: "João 3:16-21", m: "NVI", time: "19:48" },
    { id: "eb", icon: "text", t: "Escola bíblica · Lição 3", m: "4 perguntas", time: "20:10" },
    { id: "s3", icon: "music", t: "Canção final", m: "Exemplo · Lá", time: "20:30" },
  ];
  const order = base.filter((x) => x.id).map((x) => x.id);

  const OUTS = [
    { icon: "projector", n: "Projetor", m: "Monitor 2 · 1920×1080", st: "Conectada" },
    { icon: "monitor", n: "Retorno do palco", m: "Monitor 3 · atual, próximo e relógio", st: "Conectada" },
    { icon: "tv", n: "Telão lateral", m: "Rede · 192.168.0.24", st: "Conectada" },
  ];

  const SC = {
    song: {
      label: "Música", env: "culto", air: "s2", prev: "s2",
      prog: { cap: "Canção de exemplo 2 · 2/6", scr: lyr(...SONG_SLIDES[1][1].split("\n")) },
      pv: { cap: "Canção de exemplo 2 · 3/6", scr: lyr(...SONG_SLIDES[2][1].split("\n")) },
      slides: { title: "Canção de exemplo 2", list: SONG_SLIDES, air: 1, prev: 2 },
    },
    scripture: {
      label: "Escritura inesperada", env: "culto", air: "s2", prev: null, palette: true,
      prog: { cap: "Canção de exemplo 2 · 6/6", scr: lyr(...SONG_SLIDES[5][1].split("\n")) },
      pv: { cap: "Vazia", scr: blank("Nada na prévia") },
      slides: { title: "Canção de exemplo 2", list: SONG_SLIDES, air: 5, prev: -1 },
    },
    video: {
      label: "Vídeo", env: "culto", air: "vd", prev: "jo", player: true,
      prog: { cap: "Vídeo · Missões · tocando", scr: video("Vídeo · Missões", "0:42 / 2:30") },
      pv: { cap: "João 3:16-21 · 1/6", scr: verse("João 3:16 · NVI", 16) },
      note: "Ao enviar: toca nas telas de vídeo; o projetor continua como está.",
      slides: { title: "Vídeo · Missões", list: [["Vídeo", "Missões · 2:30 · toca em Projetor e Telão lateral"]], air: 0, prev: -1 },
    },
    school: {
      label: "Escola bíblica", env: "culto", air: "eb", prev: "eb",
      prog: { cap: "Lição 3 · Pergunta 2", scr: quiz("Pergunta 2", QUIZ_SLIDES[2][1]) },
      pv: { cap: "Lição 3 · Resposta · → revela", scr: quiz("Resposta", QUIZ_SLIDES[3][1]) },
      teacher: "Deixe a turma responder antes de revelar. Ligar com João 3:2.",
      slides: { title: "Escola bíblica · Lição 3", list: QUIZ_SLIDES, air: 2, prev: 3 },
    },
    nooutput: {
      label: "Sem saída", env: "culto", air: "s2", prev: "s2", outs: [], popout: true,
      prog: { cap: "Canção de exemplo 2 · 2/6", scr: lyr(...SONG_SLIDES[1][1].split("\n")) },
      pv: { cap: "Canção de exemplo 2 · 3/6", scr: lyr(...SONG_SLIDES[2][1].split("\n")) },
      slides: { title: "Canção de exemplo 2", list: SONG_SLIDES, air: 1, prev: 2 },
    },
    disconnect: {
      label: "Tela caiu", env: "culto", air: "s2", prev: "s2", popout: true,
      outs: OUTS.map((o, i) => (i === 2 ? { ...o, st: "Desconectada", warn: true, m: "Rede · 192.168.0.24 · caiu às 19:42" } : o)),
      banner: { t: "Telão lateral desconectado às 19:42", sub: "o projetor e o retorno continuam no ar" },
      prog: { cap: "Canção de exemplo 2 · 2/6", scr: lyr(...SONG_SLIDES[1][1].split("\n")) },
      pv: { cap: "Canção de exemplo 2 · 3/6", scr: lyr(...SONG_SLIDES[2][1].split("\n")) },
      slides: { title: "Canção de exemplo 2", list: SONG_SLIDES, air: 1, prev: 2 },
    },
    bible: { label: "Bíblia", env: "biblia", version: "NVI", state: "local" },
    biblemissing: { label: "Bíblia indisponível", env: "biblia", version: "ARA", state: "missing" },
  };

  // ---------- pieces ----------
  function outputsOf(s) { return s.outs || OUTS; }
  function liveContent(s, o) { // what each destination is showing right now
    if (o.warn) return "Última imagem: " + s.prog.cap;
    if (o.n === "Retorno do palco") return "Atual e próximo · 19:42";
    return s.prog.cap;
  }
  function chip(s) {
    const outs = outputsOf(s);
    if (!outs.length) return `<button class="kx-status is-warn kx-t" title="Saídas"><span class="kx-dot"></span>Nenhuma saída aberta</button>`;
    const bad = outs.filter((o) => o.warn).length;
    if (bad) return `<button class="kx-status is-warn kx-t"><span class="kx-dot"></span>Saídas · ${bad} com problema</button>`;
    return `<button class="kx-status kx-t"><span class="kx-dot"></span>Saídas · ${outs.length} de ${outs.length}</button>`;
  }
  function onScreens(s) {
    const outs = outputsOf(s), ok = outs.filter((o) => !o.warn).length;
    if (!outs.length) return `<span class="kx-meta warnmeta">em nenhuma tela</span>`;
    if (ok < outs.length) return `<span class="kx-meta warnmeta">em ${ok} de ${outs.length} telas</span>`;
    return `<span class="kx-meta">em ${ok} telas</span>`;
  }

  function topbar(s) {
    return `<header class="topbar">
      <span class="kx-mark"></span>
      <nav class="kx-tabs"><button class="${s.env === "culto" ? "is-on" : ""}">KERYX</button><button class="${s.env === "biblia" ? "is-on" : ""}">Bíblia</button></nav>
      <div class="kx-field search">${ic("search")}<span class="lab">Buscar ou comandar</span><span class="grow"></span><kbd>/</kbd></div>
      <span class="grow"></span>
      <div class="kx-seg kx-seg-mode"><button data-mode="ensaio">Ensaio</button><button class="is-on" data-mode="live">Ao vivo · 32:10</button></div>
      <span class="kx-clock">19:42</span>
      ${chip(s)}
      <span class="emerg">
        <button class="kx-btn kx-btn-icon" title="Tela preta · B">${ic("black")}</button>
        <button class="kx-btn kx-btn-icon" title="Mostrar logo · L">${ic("logo")}</button>
        <button class="kx-btn kx-btn-icon" title="Limpar texto · C">${ic("eraser")}</button>
        <button class="kx-btn kx-btn-icon" title="Encerrar">${ic("stop")}</button>
      </span>
    </header>`;
  }

  function setlistRows(s, opts = {}) {
    const ai = order.indexOf(s.air);
    return base.map((x) => {
      if (x.sec) return opts.noSec ? "" : `<div class="kx-menu-h"><span class="kx-section">${x.sec}</span></div>`;
      const i = order.indexOf(x.id);
      const st = x.id === s.air ? "is-air" : i < ai ? "is-done" : "";
      return `<div class="kx-row ${st}"><span class="kx-glyph">${ic(x.icon)}</span><span class="kx-row-main"><span class="kx-row-title">${x.t}</span><span class="kx-row-meta">${x.m}</span></span><span class="kx-row-time">${x.time}</span></div>`;
    }).join("");
  }
  // The item on air and the ones after it, as one-line rows (the live column's short Setlist).
  function upcoming(s) {
    const ai = order.indexOf(s.air);
    const rest = order.slice(ai + 2);
    return rest.length ? `<div class="kx-menu-h"><span class="kx-section">Depois</span></div>` + rest.map((id) => {
      const x = base.find((b) => b.id === id);
      return `<div class="kx-row kx-row-1"><span class="kx-glyph">${ic(x.icon)}</span><span class="kx-row-main"><span class="kx-row-title">${x.t}</span></span><span class="kx-row-time">${x.time}</span></div>`;
    }).join("") : "";
  }
  function nextOf(s) { const i = order.indexOf(s.air); return base.find((x) => x.id === order[i + 1]); }
  function airOf(s) { return base.find((x) => x.id === s.air); }

  function panel(title, body, extra = "", cls = "") {
    return `<section class="kx-panel ${cls}"><div class="kx-panel-h"><span class="kx-section">${title}</span>${extra}</div><div class="kx-panel-b">${body}</div></section>`;
  }
  function library() {
    const rows = [["music", "Canção de abertura", "Exemplo · Sol"], ["music", "Canção de exemplo 2", "Exemplo · Ré"], ["music", "Canção final", "Exemplo · Lá"], ["music", "Hino de exemplo 40", "Hinário"], ["music", "Louvor de exemplo", "Exemplo · Mi"]]
      .map(([i, t, m]) => `<div class="kx-row"><span class="kx-glyph">${ic(i)}</span><span class="kx-row-main"><span class="kx-row-title">${t}</span><span class="kx-row-meta">${m}</span></span></div>`).join("");
    return `<nav class="kx-tabs"><button class="is-on">Letras</button><button>Mídia</button><button>Avisos</button><button>Escola</button></nav>
      <div style="padding:var(--space-2)"><div class="kx-field">${ic("search")}<input placeholder="Buscar letras"></div></div>${rows}`;
  }
  function slides(s) {
    const sl = s.slides;
    return sl.list.map(([lab, t], i) => {
      const st = i === sl.air ? "is-air" : i === sl.prev ? "is-prev" : i === sl.air + 1 ? "is-next" : "";
      return `<div class="kx-slide ${st}"><span class="kx-slide-n">${i + 1}</span><span><div class="kx-slide-lab">${lab}</div>${esc(t)}</span></div>`;
    }).join("");
  }
  function sourcePanel(s, tier) {
    // medium/narrow: Setlist and Biblioteca share one panel (tabs); Setlist is the default tab.
    return `<section class="kx-panel p-src"><nav class="kx-tabs"><button class="is-on">Setlist</button><button>Biblioteca</button></nav><div class="kx-panel-b">${setlistRows(s)}</div></section>`;
  }

  function liveColumn(s, tier) {
    const next = nextOf(s), air = airOf(s);
    // Always one 28px line with what is on air and what comes next; where the Setlist is not a
    // column of its own (medium, narrow) the rest of the order fills whatever height is left.
    const nn = `<div class="nn"><div class="nn-strip"><span class="k">No ar</span><span class="air"><span class="kx-dot"></span></span><span class="v">${air.t}</span><span class="k">Próximo</span><span class="nx"><span class="kx-dot"></span></span><span class="v">${next ? next.t : "—"}</span>${next ? `<button class="kx-btn kx-btn-outline">Pôr na prévia</button>` : ""}</div>${tier === "wide" ? "" : upcoming(s)}</div>`;
    const player = s.player
      ? `<div class="kx-transport"><button class="kx-btn kx-btn-icon">${ic("pause")}</button><button class="kx-btn kx-btn-icon">${ic("stop")}</button><span class="kx-time">0:42 / 2:30</span><span class="kx-seek"><i style="width:28%"></i><b style="left:28%"></b></span><span class="kx-meter"><i><b style="height:62%"></b></i><i><b style="height:58%"></b></i></span><span class="kx-meta">Toca em Projetor · Telão</span></div>`
      : "";
    const empty = s.prev === null;
    return `<div class="col c-live"><div class="live"><div class="liveblock">
      <div class="kx-mon is-air"><div class="kx-mon-cap"><span class="kx-section">Programa</span><span class="kx-meta">${s.prog.cap}</span>${onScreens(s)}<button class="kx-btn" title="Camadas e tema do que está no ar">${ic("layers")}</button></div><div class="kx-mon-screen">${s.prog.scr}</div></div>
      <div class="liverow">
        <div class="kx-mon is-prev prev"><div class="kx-mon-cap"><span class="kx-section">Prévia</span><span class="kx-meta">${s.pv.cap}</span></div><div class="kx-mon-screen">${s.pv.scr}</div></div>
        <div class="side">
          <button class="kx-btn kx-btn-air send" title="Enviar ao ar · Enter (Ctrl+Enter de qualquer lugar)" ${empty ? "disabled" : ""}>Enviar ao ar</button>
          ${s.note ? `<div class="kx-meta">${s.note}</div>` : ""}
          ${s.teacher ? `<div class="notes"><span class="kx-meta">Notas do professor · só no console e no palco</span>${s.teacher}</div>` : ""}
          ${empty ? `<div class="kx-meta">Escolha um item da Setlist, um slide ou busque com /.</div>` : ""}
        </div>
      </div>
      <div class="slot">${player}</div>
      ${nn}
    </div></div></div>`;
  }

  function culto(s, tier) {
    const n = s.slides.list.length;
    const slidesP = `<div class="col c-slides">${panel(s.slides.title, slides(s), `<span class="kx-count kx-meta">${n} ${n === 1 ? "slide" : "slides"}</span>`)}</div>`;
    if (tier === "wide") return `
      <div class="col c-lib">${panel("Biblioteca", library())}</div>
      ${slidesP}
      ${liveColumn(s, tier)}
      <div class="col c-setlist">${panel("Setlist · Culto de domingo", setlistRows(s), `<span class="kx-count kx-meta">1h05</span>`)}</div>`;
    if (tier === "medium") return `<div class="col c-source">${sourcePanel(s, tier)}</div>${slidesP}${liveColumn(s, tier)}`;
    return `<div class="col c-source">${sourcePanel(s, tier)}${panel(s.slides.title, slides(s), `<span class="kx-count kx-meta">${s.slides.list.length}</span>`)}</div>${liveColumn(s, tier)}`;
  }

  function bible(s, tier) {
    const missing = s.state === "missing";
    const edition = missing
      ? `<span class="edition is-warn">${ic("warn")}${s.version} · não instalada</span>`
      : `<span class="edition">${ic("check")}${s.version} · instalada neste computador</span>`;
    const verses = [14, 15, 16, 17, 18, 19, 20, 21].map((n) => {
      const st = n === 16 ? "is-air" : n === 17 ? "is-prev" : "";
      return `<div class="kx-verse ${st}"><span class="kx-verse-n">${n}</span><span class="ph">Texto do versículo ${n} — vem da edição instalada</span></div>`;
    }).join("");
    const reading = missing
      ? `<div class="kx-empty" style="flex:1"><span class="kx-glyph">${ic("book")}</span><div class="kx-empty-t">A ARA não está instalada neste computador</div><div>Sem internet, nenhum texto será mostrado. O KERYX nunca projeta texto de exemplo no lugar.</div><div style="display:flex;gap:6px;margin-top:8px"><button class="kx-btn kx-btn-outline">Instalar ARA</button><button class="kx-btn">Trocar para NVI</button></div></div>`
      : `<nav class="kx-tabs"><button class="is-on">Ler</button><button>Buscar</button><button>Comparar</button>${tier === "narrow" ? "<button>Recentes</button><button>Livros</button>" : ""}</nav><div class="kx-panel-b">${verses}</div>`;
    const head = `<div class="bhead"><span class="t">João 3</span>${edition}<span class="grow" style="flex:1"></span>${tier === "narrow" ? `<div class="kx-field" style="width:150px">${ic("search")}<input value="Jo 3:16"></div>` : ""}<button class="kx-btn">${s.version} ${ic("chevron-down")}</button></div>`;
    const readCol = `<div class="col" style="flex:1"><section class="kx-panel">${head}${reading}</section></div>`;
    const pick = `<div class="col c-bpick">${panel("Bíblia", `<div style="padding:var(--space-2)"><div class="kx-field">${ic("search")}<input value="Jo 3:16"></div></div>
      <nav class="kx-tabs"><button class="is-on">Recentes</button><button>Favoritos</button><button>Notas</button></nav>
      ${["João 3:16-21", "Salmos 23", "Romanos 8:28", "Efésios 2:8-9"].map((r, i) => `<div class="kx-row kx-row-1 ${i ? "" : "is-selected"}"><span class="kx-glyph">${ic("history")}</span><span class="kx-row-main"><span class="kx-row-title">${r}</span></span></div>`).join("")}
      <div class="kx-menu-h" style="margin-top:8px"><span class="kx-section">Livros e capítulos</span></div>
      <div class="chips">${Array.from({ length: 21 }, (_, i) => `<button class="kx-btn ${i === 2 ? "is-on" : ""}">${i + 1}</button>`).join("")}</div>`)}</div>`;
    const sel = missing ? `<div class="kx-empty">Nada selecionado</div>`
      : `<div class="kx-slide is-air"><span class="kx-slide-n">16</span><span class="ph">versículo 16</span></div><div class="kx-slide is-prev"><span class="kx-slide-n">17</span><span class="ph">versículo 17</span></div>`;
    const air = `<div class="col c-bair"><section class="kx-panel"><div class="kx-panel-h"><span class="kx-section">No ar agora</span></div><div class="bair-b">
      <div class="airmon"><div class="kx-mon is-air"><div class="kx-mon-screen">${verse("João 3:16 · NVI", 16)}</div></div></div>
      <div class="kx-panel-h"><span class="kx-section">Selecionado${missing ? "" : " · João 3:17"}</span><div class="kx-seg"><button class="is-on">1</button><button>2</button><button>3</button><button>Auto</button></div></div>
      <div class="sel">${sel}</div>
      <div class="acts"><button class="kx-btn kx-btn-air" title="Enviar ao ar · Enter" ${missing ? "disabled" : ""}>Enviar ao ar</button><button class="kx-btn kx-btn-outline" ${missing ? "disabled" : ""}>Adicionar à setlist</button><button class="kx-btn kx-btn-icon" title="Favorito">${ic("star")}</button></div>
    </div></section></div>`;
    return tier === "narrow" ? readCol + air : pick + readCol + air;
  }

  function popOut(s) {
    const outs = outputsOf(s);
    const rows = outs.length ? outs.map((o) => `<div class="kx-out is-tall ${o.warn ? "is-warn" : ""}"><span class="kx-glyph">${ic(o.icon)}</span>
        <span><div class="kx-out-name">${o.n}</div><div class="kx-out-meta">${o.m}</div><div class="kx-out-meta" style="color:var(--fg-2)">Mostra: ${liveContent(s, o)}</div></span>
        <span class="kx-out-st"><span class="kx-dot"></span>${o.st}</span>
        <span class="acts">${o.warn ? `<button class="kx-btn kx-btn-outline">Copiar link da tela</button><button class="kx-btn">Remover da lista</button>` : `<button class="kx-btn">Identificar</button>`}</span></div>`).join("")
      : `<div class="kx-empty"><span class="kx-glyph">${ic("projector")}</span><div class="kx-empty-t">Nenhuma saída aberta</div><div>O Programa não está em nenhuma tela.</div><div style="display:flex;gap:6px;margin-top:8px"><button class="kx-btn kx-btn-outline">Abrir projetor</button><button class="kx-btn">Telas na rede…</button></div></div>`;
    const ok = outs.filter((o) => !o.warn).length;
    return `<div class="kx-pop pop-out"><div class="hd"><span class="kx-section">Saídas${outs.length ? ` · ${ok} de ${outs.length} conectadas` : ""}</span></div>${rows}<div class="kx-menu-sep"></div><button class="kx-menu-item"><span class="kx-glyph">${ic("check")}</span>Verificar tudo…</button></div>`;
  }

  function palette() {
    const row = (icon, t, m, acts, sel) => `<div class="kx-row ${sel ? "is-selected" : ""}"><span class="kx-glyph">${ic(icon)}</span><span class="kx-row-main"><span class="kx-row-title">${t}</span><span class="kx-row-meta">${m}</span></span><span class="kx-row-acts">${acts}</span></div>`;
    return `<div class="palette"><div class="kx-field">${ic("search")}<input value="jo 3 16"><kbd>Esc</kbd></div>
      <div class="kx-menu-h"><span class="kx-section">Bíblia · NVI instalada</span></div>
      ${row("book", "João 3:16", "Enter põe na prévia aqui · Shift+Enter adiciona à setlist", `<button class="kx-btn">Abrir na Bíblia</button>`, true)}
      ${row("book", "João 3:16-21", "Passagem da setlist · 19:48", "", false)}
      <div class="kx-menu-h"><span class="kx-section">Músicas</span></div>
      ${row("music", "Canção de exemplo 3", "Exemplo · menciona João 3:16", "", false)}</div>`;
  }

  // ---------- render ----------
  const app = document.getElementById("app");
  let tier = "wide";
  function render() {
    const s = SC[scen];
    app.innerHTML = `<div class="console" data-tier="${tier}">${topbar(s)}${s.banner ? `<div class="kx-banner is-warn">${ic("wifi-off")}${s.banner.t}<span class="kx-sub">${s.banner.sub}</span><span class="kx-spacer"></span><button class="kx-btn">Ver saídas</button></div>` : ""}<div class="main">${s.env === "biblia" ? bible(s, tier) : culto(s, tier)}</div>${s.popout ? popOut(s) : ""}${s.palette ? palette() : ""}</div>
      ${SHOT ? "" : `<div class="mock"><span class="tier">${tier} · ${innerWidth}×${innerHeight}</span>${Object.entries(SC).map(([k, v]) => `<button class="kx-btn ${k === scen ? "is-on" : ""}" data-s="${k}">${v.label}</button>`).join("")}</div>`}`;
    KERYX.mount(app);
    // The palette opens over the source side, never over the Programa.
    const pal = app.querySelector(".palette");
    if (pal) {
      const search = app.querySelector(".topbar .search").getBoundingClientRect();
      const live = app.querySelector(".c-live").getBoundingClientRect();
      const left = Math.min(search.left, live.left - 340 - 6);
      pal.style.left = Math.max(6, left) + "px";
      pal.style.width = Math.max(340, Math.min(560, live.left - 6 - Math.max(6, left))) + "px";
    }
    observe();
  }
  app.addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b) { scen = b.dataset.s; history.replaceState(null, "", "?s=" + scen); render(); } });

  let ro;
  function observe() {
    const main = app.querySelector(".main");
    if (ro) ro.disconnect();
    ro = new ResizeObserver(() => {
      const w = main.clientWidth;
      const t = w >= 1400 ? "wide" : w >= 1100 ? "medium" : "narrow";
      if (t !== tier) { tier = t; render(); }
      else { const m = app.querySelector(".mock .tier"); if (m) m.textContent = `${tier} · ${innerWidth}×${innerHeight}`; }
    });
    ro.observe(main);
  }
  render();
})();
</script>
</body>
</html>
